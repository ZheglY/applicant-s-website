version: "3.9"

services:
  db:
    image: postgres:16
    container_name: unik-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: unik
    ports:
      - "5433:5432"
    volumes:
      - unik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d unik"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: unik-app
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  unik_pgdata:

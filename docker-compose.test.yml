name: unik-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unik_test
      POSTGRES_PASSWORD: unik_test
      POSTGRES_DB: unik_test
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unik_test -d unik_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis-test:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
